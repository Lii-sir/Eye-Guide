[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeguide-v2"
version = "0.1.0"
description = "EyeGuide V2 independent application"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eyeguide*"]
