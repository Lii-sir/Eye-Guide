[project]
name = "eyeguide"
version = "0.1.0"
description = "Desktop prototype for blind navigation assistance with route guidance, camera perception, and speech feedback."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.32",
    "numpy>=1.24",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "pyttsx3>=2.90",
    "pyserial>=3.5",
    "requests>=2.31",
    "transformers>=4.51",
    "winrt-Windows.Devices.Geolocation>=3.2.1",
    "winrt-Windows.Foundation>=3.2.1",
]

[project.optional-dependencies]
yolo = [
    "lap>=0.5.12",
    "ultralytics>=8.2",
    "torch>=2.10,<2.11; sys_platform == 'win32'",
    "torchvision>=0.25,<0.26; sys_platform == 'win32'",
]
package = [
    "pyinstaller>=6.14",
]

[project.scripts]
eyeguide = "eyeguide.main:main"
eyeguide-image-search = "eyeguide.tools.image_search:main"
eyeguide-prepare-paddleseg = "eyeguide.tools.prepare_paddleseg_dataset:main"
eyeguide-train-blind-road-seg = "eyeguide.tools.train_blind_road_seg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []
