<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EyeGuide 手机控制台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">EyeGuide Phone Cloud</p>
      <h1>手机采集，电脑推理</h1>
      <p class="hero-copy">手机负责定位、方向与相机采集，电脑沿用桌面端策略做导航、视觉推理和播报决策。</p>
    </section>

    <section class="panel status-panel">
      <div class="section-head">
        <h2>实时状态</h2>
        <span id="connectionBadge" class="badge badge-offline">未连接</span>
      </div>
      <div class="status-grid">
        <article class="status-card">
          <span class="status-label">系统状态</span>
          <strong id="sessionStatus" class="status-value">等待启动</strong>
        </article>
        <article class="status-card">
          <span class="status-label">GPS 状态</span>
          <strong id="gpsStatus" class="status-value">未开始定位</strong>
        </article>
        <article class="status-card">
          <span class="status-label">当前位置</span>
          <strong id="gpsFix" class="status-value">暂无定位坐标</strong>
        </article>
        <article class="status-card">
          <span class="status-label">视觉播报</span>
          <strong id="hazardStatus" class="status-value">暂无实时信息</strong>
        </article>
        <article class="status-card">
          <span class="status-label">路线指令</span>
          <strong id="routeStatus" class="status-value">暂无导航指令</strong>
        </article>
        <article class="status-card">
          <span class="status-label">语音状态</span>
          <strong id="speechStatus" class="status-value">等待用户点击启用音频</strong>
        </article>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>模式控制</h2>
      </div>
      <div class="button-grid">
        <button id="startExploreBtn" class="btn btn-primary">启动自由探索</button>
        <button id="startNavigationBtn" class="btn btn-primary">启动路线导航</button>
        <button id="testSpeechBtn" class="btn">测试语音播报</button>
        <button id="stopBtn" class="btn btn-danger" disabled>停止当前会话</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>连接与路线配置</h2>
      </div>

      <label class="field-label" for="wsUrl">WebSocket 地址</label>
      <input id="wsUrl" class="text-input" value="ws://192.168.1.100:8000/ws/track" />

      <div class="grid two-col">
        <div>
          <label class="field-label" for="provider">导航提供方</label>
          <select id="provider" class="text-input">
            <option value="osm">OSM</option>
            <option value="amap">高德</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="objectSpeechDedupMode">普通物体播报去重</label>
          <select id="objectSpeechDedupMode" class="text-input">
            <option value="detailed">详细播报</option>
            <option value="simple">简单播报</option>
          </select>
        </div>
      </div>

      <label class="field-label" for="amapApiKey">高德 Web Key（可选）</label>
      <input id="amapApiKey" class="text-input" value="" placeholder="仅高德路线/候选搜索需要" />

      <div class="grid two-col">
        <div>
          <label class="field-label" for="origin">起点</label>
          <input id="origin" class="text-input" value="@gps" placeholder="可填写 @gps 使用当前位置" />
        </div>
        <div>
          <label class="field-label" for="destination">终点</label>
          <input id="destination" class="text-input" value="" placeholder="输入地址或经纬度" />
        </div>
      </div>

      <div class="button-grid compact">
        <button id="useCurrentGpsBtn" class="btn">用当前位置填起点</button>
        <button id="searchRouteBtn" class="btn">搜索终点候选</button>
        <button id="setRouteBtn" class="btn">生成路线</button>
        <button id="clearRouteBtn" class="btn btn-muted">清除路线</button>
        <button id="nextRouteBtn" class="btn">下一条指令</button>
        <button id="repeatRouteBtn" class="btn">重复当前指令</button>
      </div>

      <div id="candidatePanel" class="candidate-panel hidden">
        <div class="section-head inline">
          <h3>终点候选</h3>
          <span id="candidateSummary" class="mini-hint">暂无候选</span>
        </div>
        <div id="candidateList" class="candidate-list"></div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>相机与模拟</h2>
      </div>

      <div class="grid two-col">
        <div>
          <label class="field-label" for="frameIntervalMs">最小上传间隔（ms，0 表示尽量每帧）</label>
          <input id="frameIntervalMs" class="text-input" value="0" />
        </div>
        <div>
          <label class="field-label" for="frameQuality">JPEG 质量（0-1）</label>
          <input id="frameQuality" class="text-input" value="0.6" />
        </div>
      </div>

      <div class="button-grid compact">
        <button id="startCameraBtn" class="btn">启动相机上传</button>
        <button id="stopCameraBtn" class="btn btn-muted" disabled>停止相机上传</button>
      </div>

      <div class="upload-row">
        <input id="imagePicker" class="text-input" type="file" accept="image/*" capture="environment" />
        <button id="sendPickedImageBtn" class="btn">发送图片模拟推理</button>
      </div>

      <p id="cameraDiag" class="hint"></p>

      <div class="preview-wrap">
        <video id="cameraPreview" class="preview" playsinline autoplay muted></video>
        <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
      </div>
      <canvas id="frameCanvas" class="hidden-canvas"></canvas>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>运行日志</h2>
      </div>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
